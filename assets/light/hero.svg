<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <title>Muhammed Safees - Light Mode</title>

  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#0891b2" opacity=".08"/>
    </pattern>
  </defs>

  <rect width="900" height="300" rx="20" fill="url(#bg)"/>
  <rect width="900" height="300" rx="20" fill="url(#grid)"/>
  <rect x="2" y="2" width="896" height="296" rx="19"
        fill="none" stroke="#0891b2"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="45" y="55" font-size="14" fill="#0e7490" letter-spacing="4">
      HELLO WORLD / 01
    </text>

    <text x="45" y="111" font-size="49" font-weight="bold" fill="#0f172a">
      Muhammed Safees
    </text>

    <text x="48" y="151" font-size="25" font-weight="600" fill="#0e7490">
      Software Engineer Trainee
    </text>

    <text x="48" y="187" font-size="19" fill="#475569">
      JobAlign Software Solutions
    </text>

    <rect x="48" y="214" width="195" height="32" rx="7"
          fill="#cffafe" stroke="#0891b2"/>

    <text x="145" y="235" font-size="13" text-anchor="middle" fill="#0e7490">
      FULL STACK DEVELOPMENT
    </text>

    <rect x="255" y="214" width="174" height="32" rx="7"
          fill="#dbeafe" stroke="#2563eb"/>

    <text x="342" y="235" font-size="13" text-anchor="middle" fill="#1d4ed8">
      AI DEVELOPMENT
    </text>

    <text x="48" y="277" font-size="13" fill="#475569">
      BUILD / LEARN / INNOVATE
    </text>
  </g>

  <circle cx="755" cy="145" r="105" fill="none"
          stroke="#0891b2" opacity=".2"/>

  <circle cx="755" cy="145" r="83" fill="none"
          stroke="#0891b2" stroke-dasharray="8 12">
    <animateTransform attributeName="transform"
      type="rotate" from="0 755 145" to="360 755 145"
      dur="18s" repeatCount="indefinite"/>
  </circle>

  <circle cx="755" cy="145" r="65"
          fill="#e0f2fe" stroke="#0891b2"/>

  <text x="755" y="160" text-anchor="middle"
        font-family="Arial" font-size="37"
        font-weight="bold" fill="#0e7490">MS</text>

  <g>
    <circle cx="860" cy="145" r="5" fill="#0891b2"/>
    <animateTransform attributeName="transform"
      type="rotate" from="0 755 145" to="360 755 145"
      dur="7s" repeatCount="indefinite"/>
  </g>

  <rect x="45" y="290" width="810" height="3" rx="2" fill="#0891b2">
    <animate attributeName="opacity" values=".4;1;.4"
             dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
