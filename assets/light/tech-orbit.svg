    </g>

    <g fill="#1d4ed8" font-size="11">
      <g><circle cx="400" cy="137" r="23" fill="#dbeafe" stroke="#2563eb"/><text x="400" y="141">Git</text></g>
      <g><circle cx="510" cy="247" r="23" fill="#dbeafe" stroke="#2563eb"/><text x="510" y="251">Node</text></g>
      <g><circle cx="400" cy="357" r="23" fill="#dbeafe" stroke="#2563eb"/><text x="400" y="361">SQL</text></g>
      <g><circle cx="290" cy="247" r="23" fill="#dbeafe" stroke="#2563eb"/><text x="290" y="251">Java</text></g>

      <animateTransform attributeName="transform" type="rotate"
        from="360 400 247" to="0 400 247" dur="25s" repeatCount="indefinite"/>
    </g>
