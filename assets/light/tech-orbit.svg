<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <rect width="800" height="460" rx="20" fill="#f0f9ff"/>
  <rect x="2" y="2" width="796" height="456" rx="18" fill="none" stroke="#bae6fd"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="400" y="32" fill="#0e7490" font-size="17" letter-spacing="3">
      TECHNOLOGY UNIVERSE
    </text>

    <circle cx="400" cy="247" r="170" fill="none" stroke="#67e8f9"/>
    <circle cx="400" cy="247" r="110" fill="none"
            stroke="#0891b2" stroke-dasharray="5 9" opacity=".4"/>

    <circle cx="400" cy="247" r="60" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
    <text x="400" y="241" fill="#0e7490" font-size="26" font-weight="bold">MS</text>
    <text x="400" y="263" fill="#475569" font-size="12">DEVELOPER</text>

    <g font-size="12" font-weight="bold" fill="#0e7490">
      <g><circle cx="400" cy="77" r="27" fill="#e0f2fe" stroke="#0891b2"/><text x="400" y="81">Python</text></g>
      <g><circle cx="570" cy="247" r="27" fill="#e0f2fe" stroke="#0891b2"/><text x="570" y="251">React</text></g>
      <g><circle cx="400" cy="417" r="27" fill="#e0f2fe" stroke="#0891b2"/><text x="400" y="421">Laravel</text></g>
      <g><circle cx="230" cy="247" r="27" fill="#e0f2fe" stroke="#0891b2"/><text x="230" y="251">PHP</text></g>
      <g><circle cx="520" cy="127" r="27" fill="#e0f2fe" stroke="#0891b2"/><text x="520" y="131">JS</text></g>
      <g><circle cx="520" cy="367" r="27" fill="#e0f2fe" stroke="#0891b2"/><text x="520" y="371">AI</text></g>
      <g><circle cx="280" cy="127" r="27" fill="#e0f2fe" stroke="#0891b2"/><text x="280" y="131">MySQL</text></g>
      <g><circle cx="280" cy="367" r="27" fill="#e0f2fe" stroke="#0891b2"/><text x="280" y="371">Flutter</text></g>

      <animateTransform attributeName="transform" type="rotate"
